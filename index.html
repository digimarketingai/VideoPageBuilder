<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Website Creator</title>

  <style>
    :root {
      --bg: #f1f3f7;
      --panel: #fff;
      --text: #222938;
      --muted: #697386;
      --border: #dfe4ed;
      --accent: #4759db;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, "Microsoft YaHei", sans-serif;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    select:focus-visible,
    summary:focus-visible {
      outline: 3px solid #aeb8ff;
      outline-offset: 3px;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      min-height: 550px;
    }

    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      padding: 17px 22px;
      background: white;
      border-bottom: 1px solid var(--border);
    }

    .app-header h1 {
      margin: 0;
      font-size: 21px;
      letter-spacing: -.5px;
    }

    .app-header p {
      margin: 6px 0 0;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 13px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: white;
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
      line-height: 1.3;
    }

    .btn:hover {
      background: #f5f6fa;
    }

    .btn.primary {
      color: white;
      background: var(--accent);
      border-color: var(--accent);
    }

    .btn.primary:hover {
      background: #394bc8;
    }

    .btn.danger {
      color: #b3263b;
      background: #fff5f6;
      border-color: #efced4;
    }

    .btn.small {
      padding: 6px 9px;
      font-size: 11px;
    }

    .btn.active {
      color: var(--accent);
      background: #eef0ff;
      border-color: var(--accent);
    }

    .btn:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .workspace {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 410px minmax(0, 1fr);
    }

    .editor {
      overflow: auto;
      padding: 18px;
      border-right: 1px solid var(--border);
    }

    .intro {
      padding: 14px;
      margin-bottom: 14px;
      border: 1px solid #d8defc;
      border-radius: 12px;
      background: #eef1ff;
      color: #424e8d;
      font-size: 12px;
      line-height: 1.7;
    }

    .template-box {
      padding: 14px;
      margin-bottom: 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: white;
    }

    .template-box strong {
      font-size: 13px;
    }

    details.section {
      margin-bottom: 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: white;
      overflow: hidden;
    }

    details.section > summary {
      padding: 16px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    .section-body {
      padding: 0 16px 16px;
    }

    .field {
      display: block;
      margin-bottom: 13px;
    }

    .field > span {
      display: block;
      margin-bottom: 6px;
      color: #5b6373;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.5;
    }

    .field input:not([type="color"]),
    .field select,
    .field textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #d9dfea;
      border-radius: 8px;
      background: #fdfdff;
      color: var(--text);
      font-size: 13px;
    }

    .field textarea {
      min-height: 85px;
      resize: vertical;
      line-height: 1.65;
    }

    .field input[type="color"] {
      width: 100%;
      height: 40px;
      padding: 3px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: white;
    }

    .two {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .helper {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }

    .item-editor {
      margin: 13px 0;
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: #fafbfe;
    }

    .item-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 15px;
    }

    .item-header h3 {
      margin: 0;
      font-size: 13px;
    }

    .upload {
      display: block;
      margin: 12px 0;
      padding: 14px;
      border: 1px dashed #b9c1d4;
      border-radius: 10px;
      color: #59647a;
      background: #f8f9ff;
      font-size: 12px;
      line-height: 1.6;
    }

    .upload input {
      display: block;
      width: 100%;
      margin-top: 10px;
      font-size: 11px;
    }

    .media-list {
      display: grid;
      gap: 8px;
    }

    .media-row {
      display: grid;
      grid-template-columns: 60px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: white;
    }

    .media-row img,
    .media-row video {
      width: 60px;
      height: 60px;
      border-radius: 6px;
      object-fit: cover;
      background: #e9ecf2;
    }

    .media-row .field {
      margin-bottom: 7px;
    }

    .media-row .field input {
      padding: 6px;
      font-size: 11px;
    }

    .preview-panel {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      background: #e7eaf1;
    }

    .preview-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 12px 17px;
      border-bottom: 1px solid #d6dce7;
      background: #fafbfe;
    }

    .preview-toolbar strong {
      font-size: 11px;
      letter-spacing: 1px;
    }

    .preview-stage {
      display: flex;
      justify-content: center;
      flex: 1;
      min-height: 0;
      padding: 18px;
      overflow: auto;
    }

    #preview {
      width: 100%;
      height: 100%;
      min-height: 350px;
      border: 0;
      border-radius: 12px;
      background: white;
      box-shadow: 0 12px 40px #29304718;
    }

    #preview.mobile {
      width: 390px;
      max-width: 100%;
    }

    .preview-footer {
      padding: 10px 17px;
      color: var(--muted);
      background: #fafbfe;
      font-size: 11px;
      line-height: 1.5;
    }

    #toast {
      position: fixed;
      z-index: 100;
      bottom: 22px;
      left: 50%;
      transform: translate(-50%, 12px);
      max-width: calc(100vw - 30px);
      padding: 13px 19px;
      border-radius: 10px;
      background: #252d3d;
      color: white;
      box-shadow: 0 8px 30px #0002;
      font-size: 13px;
      line-height: 1.5;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity .2s, transform .2s;
    }

    #toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (min-width: 1600px) {
      .workspace {
        grid-template-columns: 455px minmax(0, 1fr);
      }
    }

    @media (max-width: 1000px) {
      .workspace {
        grid-template-columns: 350px minmax(0, 1fr);
      }

      .preview-stage {
        padding: 10px;
      }
    }

    @media (max-width: 760px) {
      .app {
        height: auto;
      }

      .app-header {
        padding: 16px;
      }

      .workspace {
        display: block;
      }

      .editor {
        overflow: visible;
        border-right: 0;
      }

      .preview-panel {
        height: 780px;
        border-top: 1px solid var(--border);
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <header class="app-header">
      <div>
        <h1>Website Creator</h1>
        <p>
          A customizable website editor for businesses, products,
          services, and portfolios.
        </p>
      </div>

      <div class="actions">
        <button type="button" class="btn" id="saveProject">
          Save project
        </button>

        <button type="button" class="btn" id="loadProject">
          Load project
        </button>

        <button type="button" class="btn primary" id="exportWebsite">
          ↓ Export website
        </button>
      </div>
    </header>

    <main class="workspace">
      <aside class="editor" id="editor"></aside>

      <section class="preview-panel">
        <div class="preview-toolbar">
          <strong>LIVE PREVIEW</strong>

          <div class="actions">
            <button
              type="button"
              class="btn small active"
              id="desktop"
              aria-pressed="true"
            >
              Desktop
            </button>

            <button
              type="button"
              class="btn small"
              id="mobile"
              aria-pressed="false"
            >
              Mobile
            </button>

            <button type="button" class="btn small" id="refresh">
              Refresh
            </button>
          </div>
        </div>

        <div class="preview-stage">
          <iframe
            id="preview"
            title="Website preview"
            sandbox="allow-scripts"
            allow="fullscreen"
          ></iframe>
        </div>

        <div class="preview-footer" id="status" role="status">
          Ready
        </div>
      </section>
    </main>
  </div>

  <input
    id="projectFile"
    type="file"
    accept=".json,application/json"
    hidden
  >

  <div id="toast" role="status" aria-live="polite"></div>

  <script>
    "use strict";

    // ==========================================================
    // GENERAL UTILITIES
    // ==========================================================

    function uid() {
      return "item-" + Date.now().toString(36) +
        "-" + Math.random().toString(36).slice(2, 10);
    }

    function clone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[character]);
    }

    function makeItem(values = {}) {
      return Object.assign({
        id: uid(),
        icon: "✦",
        nameEn: "Your item",
        nameZh: "你的项目",
        price: "",
        descriptionEn:
          "Describe your product, service, work, or offer here.",
        descriptionZh:
          "在这里介绍你的产品、服务、作品或其他内容。",
        media: []
      }, values);
    }

    // ==========================================================
    // GENERAL-PURPOSE STARTING PROJECT
    // No drink-shop branding is required by the editor.
    // ==========================================================

    function blankProject() {
      return {
        projectName: "My Website",

        nameEn: "Your Brand",
        nameZh: "你的品牌",
        icon: "✦",

        eyebrowEn: "WELCOME TO YOUR WEBSITE",
        eyebrowZh: "欢迎来到你的网站",

        titleEn: "Introduce what makes you different.",
        titleZh: "展示你的独特之处。",

        descriptionEn:
          "Use this space to introduce your business, products, services, " +
          "or creative work. Replace every example with your own content.",

        descriptionZh:
          "在这里介绍你的企业、产品、服务或创意作品。" +
          "所有示例内容都可以替换为你自己的文字。",

        primaryButtonEn: "Explore",
        primaryButtonZh: "了解更多",
        primaryUrl: "#collection",

        secondaryButtonEn: "View gallery",
        secondaryButtonZh: "查看展示",
        secondaryUrl: "#gallery",

        collectionTitleEn: "What we offer",
        collectionTitleZh: "我们的内容",

        collectionDescriptionEn:
          "Add products, services, projects, menu items, or anything " +
          "you would like to showcase.",

        collectionDescriptionZh:
          "添加产品、服务、作品、菜单项目，或任何你想展示的内容。",

        detailsEn: "View details",
        detailsZh: "查看详情",
        backEn: "Go back",
        backZh: "返回",

        previousEn: "Previous",
        previousZh: "上一个",
        nextEn: "Next",
        nextZh: "下一个",

        closingEn: "Make this website your own.",
        closingZh: "打造属于你自己的网站。",

        contactTitleEn: "Get in touch",
        contactTitleZh: "联系我们",
        contactTextEn: "",
        contactTextZh: "",

        contactButtonEn: "",
        contactButtonZh: "",
        contactUrl: "",

        footerEn: "Your Brand",
        footerZh: "你的品牌",

        accent: "#4759db",
        secondary: "#dbe1ff",
        background: "#f8f9ff",
        ink: "#252c3b",

        language: "both",
        columns: "3",

        heroMedia: [],
        items: []
      };
    }

    // ==========================================================
    // OPTIONAL EXAMPLE TEMPLATE
    // Zhang Fei Drinks is sample content, not editor branding.
    // ==========================================================

    function juiceTemplate() {
      const project = blankProject();

      Object.assign(project, {
        projectName: "Zhang Fei Drinks Example",

        nameEn: "Zhang Fei Drinks",
        nameZh: "张飞饮料店",
        icon: "🧃",

        eyebrowEn: "FRUITY FLAVORS · EVERYDAY MOMENTS",
        eyebrowZh: "果香相伴 · 日常好滋味",

        titleEn: "A fruity break for your day.",
        titleZh: "来一杯果香，歇一歇忙碌。",

        descriptionEn:
          "Welcome to Zhang Fei Drinks. Explore our example juice menu, " +
          "from familiar apple and orange to mellow pear and bright pineapple.",

        descriptionZh:
          "欢迎来到张飞饮料店。看看我们的示例果汁菜单：" +
          "苹果、橙子、梨和菠萝，总有一种果香让你心动。",

        primaryButtonEn: "Explore the menu",
        primaryButtonZh: "看看菜单",

        secondaryButtonEn: "Take a look around",
        secondaryButtonZh: "看看店里",

        collectionTitleEn: "Pick your favorite fruit flavor.",
        collectionTitleZh: "选一杯喜欢的果香。",

        collectionDescriptionEn:
          "Four example juices to get you started. " +
          "Select a card to read more.",

        collectionDescriptionZh:
          "从四款示例果汁开始，点击卡片，了解每一杯。",

        detailsEn: "About this juice",
        detailsZh: "了解这杯",
        backEn: "Back to the juice",
        backZh: "返回果汁",

        closingEn: "A little fruitiness. A little time for yourself.",
        closingZh: "一点果香，一段属于自己的时光。",

        footerEn: "Zhang Fei Drinks · Your next fruity break.",
        footerZh: "张飞饮料店 · 给日常添一点果香。",

        accent: "#b82336",
        secondary: "#f2cb86",
        background: "#fffaf2",
        ink: "#292323",
        columns: "4",

        items: [
          makeItem({
            icon: "🍎",
            nameEn: "Apple Juice",
            nameZh: "苹果汁",
            price: "¥12",
            descriptionEn:
              "A familiar apple flavor with a gentle, fruity sweetness. " +
              "An easygoing choice for a quiet break or a catch-up with friends.",
            descriptionZh:
              "熟悉的苹果果香，带着柔和的甜意。" +
              "无论独自小憩，还是与朋友聊天，都适合慢慢享用。"
          }),

          makeItem({
            icon: "🍊",
            nameEn: "Orange Juice",
            nameZh: "橙汁",
            price: "¥14",
            descriptionEn:
              "Bright citrus flavor with a lively sweet-and-tangy character. " +
              "A cheerful addition to your everyday moments.",
            descriptionZh:
              "明亮的柑橘果香，酸甜交织，口感活泼。" +
              "为平常的一天，添上一点轻快的滋味。"
          }),

          makeItem({
            icon: "🍐",
            nameEn: "Pear Juice",
            nameZh: "梨汁",
            price: "¥12",
            descriptionEn:
              "A mellow pear flavor with a delicate sweetness. " +
              "A simple option when you feel like something gentle and fruity.",
            descriptionZh:
              "梨的淡雅果香，搭配温和的甜味。" +
              "想喝一杯清雅的果味饮品时，不妨试试这一杯。"
          }),

          makeItem({
            icon: "🍍",
            nameEn: "Pineapple Juice",
            nameZh: "菠萝汁",
            price: "¥16",
            descriptionEn:
              "Distinctive pineapple flavor with a tropical sweet-and-tangy twist. " +
              "A lively choice for a little change of pace.",
            descriptionZh:
              "鲜明的菠萝风味，带着热带水果的酸甜气息。" +
              "想给日常换个口味，就来一点不一样的果香。"
          })
        ]
      });

      return project;
    }

    let state = juiceTemplate();
    let dirty = false;
    let revision = 0;
    let pendingUploads = 0;
    let previewTimer;
    let toastTimer;

    const editor = document.getElementById("editor");
    const preview = document.getElementById("preview");
    const status = document.getElementById("status");

    // ==========================================================
    // STANDALONE WEBSITE STYLES
    // ==========================================================

    const SITE_CSS = `
      :root {
        --accent: #4759db;
        --secondary: #dbe1ff;
        --background: #f8f9ff;
        --ink: #252c3b;
        --columns: 3;
      }

      * { box-sizing: border-box; }

      html { scroll-behavior: smooth; }

      body {
        margin: 0;
        background: var(--background);
        color: var(--ink);
        font-family: Arial, "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      button, a { -webkit-tap-highlight-color: transparent; }
      button { font: inherit; cursor: pointer; }
      a { color: inherit; }

      button:focus-visible, a:focus-visible {
        outline: 3px solid var(--secondary);
        outline-offset: 4px;
      }

      .container {
        width: min(1240px, calc(100% - 64px));
        margin-inline: auto;
      }

      .site-header {
        border-bottom: 1px solid #25253516;
      }

      .navigation {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 18px;
        min-height: 96px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
        text-decoration: none;
      }

      .brand-icon {
        display: grid;
        place-items: center;
        flex-shrink: 0;
        width: 46px;
        height: 46px;
        border-radius: 14px 14px 14px 4px;
        color: white;
        background: var(--accent);
        font-size: 27px;
      }

      .brand-copy {
        min-width: 0;
        overflow-wrap: anywhere;
      }

      .brand-copy .zh {
        display: block;
        margin-bottom: 4px;
        font-size: 20px;
        font-weight: 900;
      }

      .brand-copy .en {
        display: block;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 1px;
      }

      .languages {
        display: flex;
        gap: 3px;
        flex-shrink: 0;
        padding: 4px;
        border: 1px solid #25253520;
        border-radius: 25px;
      }

      .languages button {
        padding: 7px 9px;
        border: 0;
        border-radius: 20px;
        background: transparent;
        color: var(--ink);
        font-size: 11px;
        font-weight: 700;
      }

      .languages button.active {
        color: white;
        background: var(--accent);
      }

      .hero {
        display: grid;
        grid-template-columns: 1.05fr 1fr;
        align-items: center;
        gap: 55px;
        padding-block: 70px 80px;
      }

      .eyebrow {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 12px;
        margin-bottom: 22px;
        color: var(--accent);
        font-size: 10px;
        font-weight: 800;
        line-height: 1.6;
        letter-spacing: 1.7px;
      }

      h1 {
        margin: 0 0 24px;
        overflow-wrap: anywhere;
      }

      h1 .zh {
        display: block;
        margin-bottom: 14px;
        font-size: clamp(35px, 4.6vw, 62px);
        line-height: 1.22;
        letter-spacing: -1px;
      }

      h1 .en {
        display: block;
        font-size: clamp(35px, 4.3vw, 59px);
        line-height: 1.06;
        letter-spacing: -2px;
      }

      .description {
        font-size: 14px;
        line-height: 1.9;
        opacity: .78;
        overflow-wrap: anywhere;
      }

      .description .zh, .description .en {
        display: block;
        white-space: pre-line;
      }

      .description .zh { margin-bottom: 9px; }

      .hero-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 27px;
      }

      .site-button {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px 9px;
        padding: 14px 18px;
        border: 1px solid #25253525;
        border-radius: 10px;
        color: var(--ink);
        background: transparent;
        font-size: 12px;
        font-weight: 800;
        line-height: 1.5;
        text-decoration: none;
      }

      .site-button.primary {
        color: white;
        background: var(--accent);
        border-color: var(--accent);
      }

      .site-button:hover { filter: brightness(.95); }

      .hero-visual {
        min-width: 0;
        padding: 15px 0 0 15px;
        position: relative;
        scroll-margin-top: 20px;
      }

      .hero-visual::before {
        content: "";
        position: absolute;
        inset: 0 15px 15px 0;
        border: 1px solid var(--accent);
        border-radius: 110px 22px 22px 22px;
        opacity: .3;
        pointer-events: none;
      }

      .gallery {
        position: relative;
        height: 100%;
        overflow: hidden;
        background: var(--secondary);
        isolation: isolate;
      }

    // ==========================================================
    // EXPORTED WEBSITE RENDERER
    // Self-contained: does not use editor variables.
    // ==========================================================

    function renderSite(data) {
      const escape = value =>
        String(value ?? "").replace(/[&<>"']/g, character => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        })[character]);

      function bilingual(en, zh) {
        return (
          (zh ? '<span class="zh" lang="zh-CN">' + escape(zh) + "</span>" : "") +
          (en ? '<span class="en" lang="en">' + escape(en) + "</span>" : "")
        );
      }

      function safeUrl(value) {
        const url = String(value || "").trim();

        if (/^#[A-Za-z][A-Za-z0-9_-]*$/.test(url)) {
          return url;
        }

        if (/[\u0000-\u0020\u007f]/.test(url)) {
          return "";
        }

        try {
          const parsed = new URL(url);

          if (["https:", "http:", "mailto:", "tel:"].includes(parsed.protocol)) {
            return url;
          }
        } catch (_) {
          // Invalid or unsupported URL: do not render the link.
        }

        return "";
      }

      function link(en, zh, url, primary = false) {
        const destination = safeUrl(url);

        if (!destination || (!en && !zh)) {
          return "";
        }

        const external = /^https?:/i.test(destination);

        return `
          <a
            class="site-button ${primary ? "primary" : ""}"
            href="${escape(destination)}"
            ${external ? 'target="_blank" rel="noopener noreferrer"' : ""}
          >
            ${bilingual(en, zh)}
          </a>
        `;
      }

      function gallery(media, icon, titleEn, titleZh, hero = false) {
        if (!media.length) {
          return `
            <div class="gallery">
              <div class="placeholder">
                <span class="placeholder-icon" aria-hidden="true">
                  ${escape(icon)}
                </span>

                ${hero ? `
                  <div class="placeholder-title">
                    ${bilingual(titleEn, titleZh)}
                  </div>
                ` : ""}
              </div>
            </div>
          `;
        }

        return `
          <div class="gallery" data-gallery data-index="0">
            <div class="gallery-stage">
              ${media.map((item, index) => `
                <div class="slide" ${index ? "hidden" : ""}>
                  ${item.type === "video" ? `
                    <video
                      src="${escape(item.src)}"
                      controls
                      playsinline
                      preload="metadata"
                      aria-label="${escape(item.name || titleEn || titleZh)}"
                    ></video>
                  ` : `
                    <img
                      src="${escape(item.src)}"
                      alt="${escape(item.name || titleEn || titleZh)}"
                      loading="${hero && index === 0 ? "eager" : "lazy"}"
                    >
                  `}
                </div>
              `).join("")}
            </div>

            ${media.length > 1 ? `
              <div class="gallery-controls">
                <button type="button" data-step="-1" aria-label="Previous media">
                  ${bilingual(data.previousEn, data.previousZh) || "←"}
                </button>

                <span class="gallery-count" aria-live="polite">
                  1 / ${media.length}
                </span>

                <button type="button" data-step="1" aria-label="Next media">
                  ${bilingual(data.nextEn, data.nextZh) || "→"}
                </button>
              </div>
            ` : ""}
          </div>
        `;
      }

      const style = document.documentElement.style;

      style.setProperty("--accent", data.accent);
      style.setProperty("--secondary", data.secondary);
      style.setProperty("--background", data.background);
      style.setProperty("--ink", data.ink);
      style.setProperty("--columns", data.columns);

      document.title =
        [data.nameZh, data.nameEn].filter(Boolean).join(" · ") || "Website";

      const hasCollection =
        data.items.length ||
        data.collectionTitleEn ||
        data.collectionTitleZh ||
        data.collectionDescriptionEn ||
        data.collectionDescriptionZh;

      const contactLink = link(
        data.contactButtonEn,
        data.contactButtonZh,
        data.contactUrl,
        true
      );

      const hasContact =
        data.contactTextEn || data.contactTextZh || contactLink;

      document.getElementById("site").innerHTML = `
        <header class="site-header">
          <div class="container navigation">
            <a class="brand" href="#home">
              ${data.icon ? `
                <span class="brand-icon" aria-hidden="true">
                  ${escape(data.icon)}
                </span>
              ` : ""}

              <span class="brand-copy">
                ${bilingual(data.nameEn, data.nameZh)}
              </span>
            </a>

            <nav class="languages" aria-label="Language">
              <button type="button" data-language="both">中 / EN</button>
              <button type="button" data-language="zh">中文</button>
              <button type="button" data-language="en">EN</button>
            </nav>
          </div>
        </header>

        <main id="home">
          <section class="hero container">
            <div class="hero-copy">
              <div class="eyebrow">
                ${bilingual(data.eyebrowEn, data.eyebrowZh)}
              </div>

              <h1>${bilingual(data.titleEn, data.titleZh)}</h1>

              <div class="description">
                ${bilingual(data.descriptionEn, data.descriptionZh)}
              </div>

              <div class="hero-actions">
                ${link(
                  data.primaryButtonEn,
                  data.primaryButtonZh,
                  data.primaryUrl,
                  true
                )}

                ${link(
                  data.secondaryButtonEn,
                  data.secondaryButtonZh,
                  data.secondaryUrl
                )}
              </div>
            </div>

            <div class="hero-visual" id="gallery">
              ${gallery(
                data.heroMedia,
                data.icon,
                data.nameEn,
                data.nameZh,
                true
              )}
            </div>
          </section>

          ${hasCollection ? `
            <section class="collection container" id="collection">
              <div class="section-heading">
                <h2>
                  ${bilingual(
                    data.collectionTitleEn,
                    data.collectionTitleZh
                  )}
                </h2>

                <div class="description">
                  ${bilingual(
                    data.collectionDescriptionEn,
                    data.collectionDescriptionZh
                  )}
                </div>
              </div>

              <div class="item-grid">
                ${data.items.map((item, index) => `
                  <article class="item-card">
                    <div class="flip-shell">
                      <div class="flip-inner">
                        <div class="card-face card-front">
                          ${gallery(
                            item.media,
                            item.icon,
                            item.nameEn,
                            item.nameZh
                          )}
                        </div>

                        <div
                          class="card-face card-back"
                          id="details-${index}"
                          aria-hidden="true"
                          inert
                        >
                          <span class="back-icon" aria-hidden="true">
                            ${escape(item.icon)}
                          </span>

                          <h3>
                            ${bilingual(item.nameEn, item.nameZh)}
                          </h3>

                          <div class="description">
                            ${bilingual(
                              item.descriptionEn,
                              item.descriptionZh
                            )}
                          </div>
                        </div>
                      </div>
                    </div>

                    <div class="item-info">
                      <div class="title-row">
                        <h3 class="item-title">
                          ${bilingual(item.nameEn, item.nameZh)}
                        </h3>

                        ${item.price ? `
                          <span class="price">${escape(item.price)}</span>
                        ` : ""}
                      </div>

                      <button
                        class="flip-button"
                        type="button"
                        aria-expanded="false"
                        aria-controls="details-${index}"
                      >
                        ${bilingual(data.detailsEn, data.detailsZh) || "↗"}
                      </button>
                    </div>
                  </article>
                `).join("")}
              </div>
            </section>
          ` : ""}

          ${data.closingEn || data.closingZh ? `
            <section class="closing container">
              ${bilingual(data.closingEn, data.closingZh)}
            </section>
          ` : ""}

          ${hasContact ? `
            <section class="contact container" id="contact">
              <h2>
                ${bilingual(data.contactTitleEn, data.contactTitleZh)}
              </h2>

              <div class="description">
                ${bilingual(data.contactTextEn, data.contactTextZh)}
              </div>

              ${contactLink}
            </section>
          ` : ""}
        </main>

        <footer>
          ${bilingual(data.footerEn, data.footerZh)}
        </footer>
      `;

      function setLanguage(language) {
        const selected = ["both", "en", "zh"].includes(language)
          ? language
          : "both";

        document.body.dataset.language = selected;
        document.documentElement.lang = selected === "en" ? "en" : "zh-CN";

        document.querySelectorAll("[data-language]").forEach(button => {
          const active = button.dataset.language === selected;
          button.classList.toggle("active", active);
          button.setAttribute("aria-pressed", String(active));
        });
      }

      document.querySelectorAll("[data-language]").forEach(button => {
        button.addEventListener("click", () => {
          setLanguage(button.dataset.language);
        });
      });

      setLanguage(data.language);

      document.querySelectorAll("[data-gallery]").forEach(element => {
        const slides = Array.from(element.querySelectorAll(".slide"));
        const count = element.querySelector(".gallery-count");

        element.querySelectorAll("[data-step]").forEach(button => {
          button.addEventListener("click", () => {
            const current = Number(element.dataset.index);

            const next = (
              current + Number(button.dataset.step) + slides.length
            ) % slides.length;

            slides[current].querySelectorAll("video").forEach(video => {
              video.pause();
            });

            slides.forEach((slide, index) => {
              slide.hidden = index !== next;
            });

            element.dataset.index = String(next);

            if (count) {
              count.textContent = (next + 1) + " / " + slides.length;
            }
          });
        });
      });

      document.querySelectorAll(".item-card").forEach(card => {
        const button = card.querySelector(".flip-button");
        const front = card.querySelector(".card-front");
        const back = card.querySelector(".card-back");

        button.addEventListener("click", () => {
          const flipped = card.classList.toggle("flipped");

          button.setAttribute("aria-expanded", String(flipped));
          front.setAttribute("aria-hidden", String(flipped));
          back.setAttribute("aria-hidden", String(!flipped));

          front.toggleAttribute("inert", flipped);
          back.toggleAttribute("inert", !flipped);

          button.innerHTML = flipped
            ? bilingual(data.backEn, data.backZh) || "↶"
            : bilingual(data.detailsEn, data.detailsZh) || "↗";

          if (flipped) {
            front.querySelectorAll("video").forEach(video => video.pause());
          }
        });
      });
    }

    // ==========================================================
    // BUILD A COMPLETE STANDALONE HTML DOCUMENT
    // ==========================================================

    function createDocument(project) {
      const serialized = JSON.stringify(project)
        .replace(/</g, "\\u003c")
        .replace(/\u2028/g, "\\u2028")
        .replace(/\u2029/g, "\\u2029");

      const title = esc(
        [project.nameZh, project.nameEn].filter(Boolean).join(" · ") ||
        "Website"
      );

      const description = esc(
        [project.descriptionEn, project.descriptionZh]
          .filter(Boolean)
          .join(" ")
      );

      return (
        "<!DOCTYPE html>\n" +
        '<html lang="' + (project.language === "en" ? "en" : "zh-CN") + '">\n' +
        "<head>\n" +
        '<meta charset="UTF-8">\n' +
        '<meta name="viewport" content="width=device-width, initial-scale=1">\n' +
        '<meta name="description" content="' + description + '">\n' +
        '<meta name="theme-color" content="' + esc(project.accent) + '">\n' +
        "<title>" + title + "</title>\n" +
        "<style>" + SITE_CSS + "</style>\n" +
        "</head>\n<body>\n" +
        '<div id="site"></div>\n' +
        "<noscript>Please enable JavaScript to view this website.</noscript>\n" +
        "<script>\n(" + renderSite.toString() + ")(" + serialized + ");\n" +
        "<" + "/script>\n" +
        "</body>\n</html>"
      );
    }

    // ==========================================================
    // EDITOR HTML HELPERS
    // ==========================================================

    function field(key, label, options = {}) {
      const object = options.item || state;
      const value = object[key] ?? "";

      const binding = options.item
        ? `data-item="${esc(options.item.id)}" data-key="${esc(key)}"`
        : `data-field="${esc(key)}"`;

      let control;

      if (options.type === "textarea") {
        control = `<textarea ${binding} rows="3">${esc(value)}</textarea>`;
      } else if (options.type === "select") {
        control = `
          <select ${binding}>
            ${options.options.map(([optionValue, optionLabel]) => `
              <option
                value="${esc(optionValue)}"
                ${value === optionValue ? "selected" : ""}
              >${esc(optionLabel)}</option>
            `).join("")}
          </select>
        `;
      } else {
        control = `
          <input
            type="${options.type || "text"}"
            ${binding}
            value="${esc(value)}"
          >
        `;
      }

      return `
        <label class="field">
          <span>${esc(label)}</span>
          ${control}
        </label>
      `;
    }

    function pair(base, label, type = "text", item = null) {
      const options = { type, item };

      return (
        field(base + "En", label + " — English", options) +
        field(base + "Zh", label + " — 中文", options)
      );
    }

    function section(id, title, content, open = false) {
      return `
        <details class="section" data-section="${id}" ${open ? "open" : ""}>
          <summary>${title}</summary>
          <div class="section-body">${content}</div>
        </details>
      `;
    }

    function mediaEditor(media, owner) {
      return `
        <label class="upload">
          <strong>Add photos or videos</strong><br>
          Multiple files create a gallery. Uploads are embedded in your export.

          <input
            type="file"
            accept="image/*,video/*"
            multiple
            data-upload="${esc(owner)}"
          >
        </label>

        <div class="media-list">
          ${media.map((item, index) => `
            <div class="media-row">
              ${item.type === "video" ? `
                <video
                  src="${esc(item.src)}"
                  muted
                  playsinline
                  preload="metadata"
                  aria-label="${esc(item.name)}"
                ></video>
              ` : `
                <img src="${esc(item.src)}" alt="${esc(item.name)}">
              `}

              <div>
                <label class="field">
                  <span>Media description / image alt text</span>
                  <input
                    type="text"
                    value="${esc(item.name)}"
                    data-media-owner="${esc(owner)}"
                    data-media-index="${index}"
                  >
                </label>

                <div class="actions">
                  <button
                    class="btn small"
                    type="button"
                    data-action="media-up"
                    data-owner="${esc(owner)}"
                    data-index="${index}"
                    aria-label="Move media earlier"
                    ${index === 0 ? "disabled" : ""}
                  >↑</button>

                  <button
                    class="btn small"
                    type="button"
                    data-action="media-down"
                    data-owner="${esc(owner)}"
                    data-index="${index}"
                    aria-label="Move media later"
                    ${index === media.length - 1 ? "disabled" : ""}
                  >↓</button>

                  <button
                    class="btn small danger"
                    type="button"
                    data-action="media-delete"
                    data-owner="${esc(owner)}"
                    data-index="${index}"
                  >Remove</button>
                </div>
              </div>
            </div>
          `).join("")}
        </div>
      `;
    }

    function itemEditor(item, index) {
      return `
        <div class="item-editor">
          <div class="item-header">
            <h3>Item ${index + 1}</h3>

            <div class="actions">
              <button
                type="button"
                class="btn small"
                data-action="item-up"
                data-id="${esc(item.id)}"
                aria-label="Move item up"
                ${index === 0 ? "disabled" : ""}
              >↑</button>

              <button
                type="button"
                class="btn small"
                data-action="item-down"
                data-id="${esc(item.id)}"
                aria-label="Move item down"
                ${index === state.items.length - 1 ? "disabled" : ""}
              >↓</button>

              <button
                type="button"
                class="btn small"
                data-action="item-copy"
                data-id="${esc(item.id)}"
              >Copy</button>

              <button
                type="button"
                class="btn small danger"
                data-action="item-delete"
                data-id="${esc(item.id)}"
              >Delete</button>
            </div>
          </div>

          <div class="two">
            ${field("icon", "Placeholder emoji / symbol", { item })}
            ${field("price", "Price or short label — optional", { item })}
          </div>

          <p class="helper">
            The price field accepts any text, such as $25, ¥12,
            From £50, Free, or New. Leave it empty to hide it.
          </p>

          ${pair("name", "Item name / title", "text", item)}
          ${pair("description", "Details / description", "textarea", item)}

          ${mediaEditor(item.media, item.id)}
        </div>
      `;
    }

    // ==========================================================
    // RENDER THE GENERAL-PURPOSE EDITOR
    // ==========================================================

    function renderEditor() {
      const firstRender = !editor.children.length;

      const openSections = new Set(
        Array.from(editor.querySelectorAll("details[open]"))
          .map(element => element.dataset.section)
      );

      const scrollPosition = editor.scrollTop;

      editor.innerHTML = `
        <div class="intro">
          <strong>Your website. Your content.</strong><br>
          This editor is not limited to a drink shop.
          Use it for a business, product catalog, service list,
          restaurant menu, portfolio, or another showcase.
          All visible example wording is editable.
        </div>

        <div class="template-box">
          <strong>Starting points</strong>

          <p class="helper">
            张飞饮料店 is only an example template, with apple,
            orange, pear, and pineapple juice.
            Names, descriptions, and prices are sample content—
            replace them with your actual information.
          </p>

          <div class="actions">
            <button
              class="btn small"
              type="button"
              data-action="template"
            >
              Load juice-shop example
            </button>

            <button
              class="btn small"
              type="button"
              data-action="blank"
            >
              Start blank
            </button>
          </div>
        </div>

        ${section("brand", "01 · Project & brand", `
          ${field("projectName", "Project name — editor / download filename")}
          ${pair("name", "Website / brand name")}
          ${field("icon", "Brand emoji or symbol — optional")}

          ${field("language", "Default website language", {
            type: "select",
            options: [
              ["both", "Chinese + English / 中英双语"],
              ["en", "English"],
              ["zh", "中文"]
            ]
          })}

          <p class="helper">
            Use either language or both. Empty text fields are omitted
            from the corresponding website text.
          </p>
        `, true)}

        ${section("appearance", "02 · Colors & layout", `
          <div class="two">
            ${field("accent", "Accent / button color", { type: "color" })}
            ${field("secondary", "Placeholder / secondary color", { type: "color" })}
            ${field("background", "Page background", { type: "color" })}
            ${field("ink", "Text color", { type: "color" })}
          </div>

          ${field("columns", "Maximum item columns on wide screens", {
            type: "select",
            options: [
              ["1", "1 column"],
              ["2", "2 columns"],
              ["3", "3 columns"],
              ["4", "4 columns"]
            ]
          })}

          <p class="helper">
            Smaller screens use fewer columns automatically.
            Choose colors that keep your text easy to read.
          </p>
        `)}

        ${section("hero", "03 · Main introduction", `
          ${pair("eyebrow", "Small introductory heading")}
          ${pair("title", "Main headline")}
          ${pair("description", "Introduction", "textarea")}
        `)}

        ${section("buttons", "04 · Main buttons & destinations", `
          ${pair("primaryButton", "Primary button label")}
          ${field("primaryUrl", "Primary button destination")}

          ${pair("secondaryButton", "Secondary button label")}
          ${field("secondaryUrl", "Secondary button destination")}

          <p class="helper">
            Built-in destinations: <strong>#collection</strong>,
            <strong>#gallery</strong>, <strong>#contact</strong>,
            and <strong>#home</strong>.<br>
            You can also use a full https:// address, mailto: address,
            or tel: number. External web links open in a new tab.<br>
            Leave a destination or both labels empty to hide that button.
          </p>
        `)}

        ${section("gallery", "05 · Main photo / video gallery", `
          <p class="helper">
            Show your business, products, services, work, team,
            venue, or another subject. Without uploads,
            the website displays your chosen symbol and brand name.
          </p>

          ${mediaEditor(state.heroMedia, "hero")}

          <p class="helper">
            Use reasonably sized files. Large videos increase
            project and website size. Playback depends on the
            format supported by the visitor's browser.
          </p>
        `)}

        ${section("collection", "06 · Collection heading", `
          ${pair("collectionTitle", "Section title")}
          ${pair("collectionDescription", "Section introduction", "textarea")}

          <p class="helper">
            Name this section anything you like:
            Menu, Products, Services, Portfolio, Projects, Packages, or Offers.
          </p>
        `)}

        ${section("items", "07 · Items / products / services / projects", `
          <p class="helper">
            Every card is fully editable. Add, copy, reorder,
            or remove items. Photos, videos, descriptions,
            prices, and short labels are optional.
          </p>

          ${state.items.length
            ? state.items.map(itemEditor).join("")
            : '<p class="helper">No items yet. Add your first item below.</p>'
          }

          <button
            class="btn primary"
            type="button"
            data-action="item-add"
            style="width:100%"
          >
            ＋ Add item
          </button>
        `, true)}

        ${section("labels", "08 · Card & gallery button wording", `
          ${pair("details", "Show-details button")}
          ${pair("back", "Return button")}
          ${pair("previous", "Previous media button")}
          ${pair("next", "Next media button")}

          <p class="helper">
            These labels are shared by all cards and galleries.
            Replace template-specific wording for your own use case.
          </p>
        `)}

        ${section("closing", "09 · Closing message & footer", `
          ${pair("closing", "Closing message")}
          ${pair("footer", "Footer text", "textarea")}

          <p class="helper">
            Clear both closing-message fields to hide the closing panel.
          </p>
        `)}

        ${section("contact", "10 · Contact / extra information — optional", `
          ${pair("contactTitle", "Section heading")}
          ${pair("contactText", "Contact details / additional information", "textarea")}

          ${pair("contactButton", "Contact / action button label")}
          ${field("contactUrl", "Contact / action button destination")}

          <p class="helper">
            Add an address, opening hours, contact information,
            booking instructions, or other details.<br>
            Examples: mailto:hello@example.com,
            tel:+15551234567, or your full booking-page address.<br>
            This section stays hidden if its information is empty
            and it has no usable action button.
          </p>
        `)}

        <p class="helper">
          <strong>Save project:</strong> download an editable JSON backup,
          including uploaded media.<br>
          <strong>Load project:</strong> reopen a backup in this editor.<br>
          <strong>Export website:</strong> download the finished standalone HTML.<br><br>
          Changes are kept in this tab only until you save a project.
          Exporting HTML does not publish the site online.
        </p>
      `;

      if (!firstRender) {
        editor.querySelectorAll("details").forEach(element => {
          element.open = openSections.has(element.dataset.section);
        });
      }

      editor.scrollTop = scrollPosition;
    }

    // ==========================================================
    // PREVIEW AND CHANGE TRACKING
    // ==========================================================

    function updatePreview() {
      clearTimeout(previewTimer);
      status.textContent = "Updating preview…";
      preview.srcdoc = createDocument(state);
    }

    function changed() {
      dirty = true;
      revision++;
      clearTimeout(previewTimer);
      status.textContent = "Unsaved changes · Updating preview…";
      previewTimer = setTimeout(updatePreview, 500);
    }

    preview.addEventListener("load", () => {
      status.textContent = dirty
        ? "Preview updated · Save your project to keep your changes."
        : "Preview updated · Your project is ready to edit.";
    });

    function getMedia(owner) {
      if (owner === "hero") {
        return state.heroMedia;
      }

      return state.items.find(item => item.id === owner)?.media;
    }

    editor.addEventListener("input", event => {
      const target = event.target;

      if (target.dataset.field) {
        state[target.dataset.field] = target.value;
        changed();
        return;
      }

      if (target.dataset.item && target.dataset.key) {
        const item = state.items.find(
          entry => entry.id === target.dataset.item
        );

        if (item) {
          item[target.dataset.key] = target.value;
          changed();
        }

        return;
      }

      if (target.dataset.mediaOwner) {
        const media = getMedia(target.dataset.mediaOwner);
        const item = media?.[Number(target.dataset.mediaIndex)];

        if (item) {
          item.name = target.value;
          changed();
        }
      }
    });

    function move(array, index, direction) {
      const destination = index + direction;

      if (
        !array ||
        index < 0 ||
        index >= array.length ||
        destination < 0 ||
        destination >= array.length
      ) {
        return;
      }

      [array[index], array[destination]] =
        [array[destination], array[index]];
    }

    editor.addEventListener("click", event => {
      const button = event.target.closest("button[data-action]");

      if (!button) return;

      const action = button.dataset.action;

      if (action === "template" || action === "blank") {
        if (!confirm(
          "Replace the current project? Save a project backup first " +
          "if you want to keep it."
        )) {
          return;
        }

        state = action === "template" ? juiceTemplate() : blankProject();

        renderEditor();
        changed();

        toast(action === "template"
          ? "Example template loaded. Every field is editable."
          : "Blank starting project loaded."
        );

        return;
      }

      const index = state.items.findIndex(
        item => item.id === button.dataset.id
      );

      if (action === "item-add") {
        state.items.push(makeItem());
      } else if (action === "item-delete") {
        if (index < 0 || !confirm("Delete this item and its uploaded media?")) {
          return;
        }

        state.items.splice(index, 1);
      } else if (action === "item-copy") {
        if (index < 0) return;

        const copy = clone(state.items[index]);
        copy.id = uid();
        state.items.splice(index + 1, 0, copy);
      } else if (action === "item-up") {
        move(state.items, index, -1);
      } else if (action === "item-down") {
        move(state.items, index, 1);
      } else if (action.startsWith("media-")) {
        const media = getMedia(button.dataset.owner);
        const mediaIndex = Number(button.dataset.index);

        if (!media) return;

        if (action === "media-delete") {
          media.splice(mediaIndex, 1);
        } else {
          move(media, mediaIndex, action === "media-up" ? -1 : 1);
        }
      } else {
        return;
      }

      renderEditor();
      changed();
    });

    // ==========================================================
    // MEDIA UPLOADS
    // ==========================================================

    function readDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();

        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error("Could not read " + file.name));
        reader.onabort = () => reject(new Error("File reading was cancelled."));

        reader.readAsDataURL(file);
      });
    }

    editor.addEventListener("change", async event => {
      const input = event.target.closest("input[data-upload]");
      if (!input) return;

      const selectedFiles = Array.from(input.files || []);

      const files = selectedFiles.filter(file =>
        file.type.startsWith("image/") ||
        file.type.startsWith("video/")
      );

      if (!files.length) {
        input.value = "";
        toast("Select image or video files recognized by your browser.");
        return;
      }

      const bytes = files.reduce((total, file) => total + file.size, 0);

      if (
        bytes > 30 * 1024 * 1024 &&
        !confirm(
          "These files exceed 30 MB. Large embedded files can make " +
          "editing and exporting slow. Continue?"
        )
      ) {
        input.value = "";
        return;
      }

      const owner = input.dataset.upload;
      const projectAtStart = state;
      const mediaAtStart = getMedia(owner);

      if (!mediaAtStart) return;

      input.disabled = true;
      pendingUploads++;
      status.textContent = "Reading uploaded files…";

      let added = 0;
      let failed = 0;
      let cancelled = false;

      try {
        for (const file of files) {
          try {
            const src = await readDataURL(file);

            if (
              state !== projectAtStart ||
              getMedia(owner) !== mediaAtStart
            ) {
              cancelled = true;
              break;
            }

            mediaAtStart.push({
              name: file.name,
              type: file.type.startsWith("video/") ? "video" : "image",
              src
            });

            added++;
            dirty = true;
            revision++;
          } catch (error) {
            console.error(error);
            failed++;
          }
        }
      } finally {
        pendingUploads--;
        input.disabled = false;
        input.value = "";
      }

      if (cancelled) {
        toast("Upload stopped because its project or item was replaced.");
        return;
      }

      renderEditor();
      updatePreview();

      toast(
        added + " file(s) added." +
        (failed ? " " + failed + " file(s) could not be read." : "") +
        (selectedFiles.length > files.length
          ? " Unsupported files were skipped."
          : "")
      );
    });

    // ==========================================================
    // IMPORT VALIDATION
    // ==========================================================

    function normalizeMedia(value) {
      if (!Array.isArray(value)) return [];

      return value.filter(item => {
        if (!item || typeof item.src !== "string") return false;

        if (item.type === "image") {
          return /^data:image\/[a-z0-9.+-]+;base64,/i.test(item.src);
        }

        if (item.type === "video") {
          return /^data:video\/[a-z0-9.+-]+;base64,/i.test(item.src);
        }

        return false;
      }).map(item => ({
        name: typeof item.name === "string" ? item.name : "Uploaded media",
        type: item.type,
        src: item.src
      }));
    }

    function normalizeProject(input) {
      const source = input?.state || input;

      if (!source || typeof source !== "object") {
        throw new Error("This is not a compatible project file.");
      }

      // Also accept the earlier drink-specific creator structure.
      const oldFormat = !Array.isArray(source.items) &&
        Array.isArray(source.dishes);

      if (!Array.isArray(source.items) && !oldFormat) {
        throw new Error("This file does not contain a compatible item list.");
      }

      const project = blankProject();

      Object.keys(project).forEach(key => {
        if (
          typeof project[key] === "string" &&
          typeof source[key] === "string"
        ) {
          project[key] = source[key];
        }
      });

      if (oldFormat) {
        const mapping = {
          icon: "heroIcon",
          secondary: "gold",
          language: "defaultLanguage",
          primaryButtonEn: "menuButtonEn",
          primaryButtonZh: "menuButtonZh",
          secondaryButtonEn: "heroButtonEn",
          secondaryButtonZh: "heroButtonZh",
          collectionTitleEn: "menuTitleEn",
          collectionTitleZh: "menuTitleZh",
          collectionDescriptionEn: "menuDescriptionEn",
          collectionDescriptionZh: "menuDescriptionZh"
        };

        Object.entries(mapping).forEach(([newKey, oldKey]) => {
          if (typeof source[oldKey] === "string") {
            project[newKey] = source[oldKey];
          }
        });

        project.projectName = source.nameEn || "Imported Website";
      }

      const defaults = blankProject();

      ["accent", "secondary", "background", "ink"].forEach(key => {
        if (!/^#[0-9a-f]{6}$/i.test(project[key])) {
          project[key] = defaults[key];
        }
      });

      if (!["both", "en", "zh"].includes(project.language)) {
        project.language = "both";
      }

      if (!["1", "2", "3", "4"].includes(project.columns)) {
        project.columns = "3";
      }

      project.heroMedia = normalizeMedia(source.heroMedia);

      const items = oldFormat ? source.dishes : source.items;

      project.items = items
        .filter(item => item && typeof item === "object")
        .map(item => {
          const normalized = makeItem();

          [
            "icon",
            "nameEn",
            "nameZh",
            "price",
            "descriptionEn",
            "descriptionZh"
          ].forEach(key => {
            if (typeof item[key] === "string") {
              normalized[key] = item[key];
            }
          });

          normalized.media = normalizeMedia(item.media);
          return normalized;
        });

      return project;
    }

    // ==========================================================
    // SAVE, LOAD, AND EXPORT
    // ==========================================================

    function filenameBase() {
      return (
        (state.projectName || state.nameEn || state.nameZh || "website")
          .replace(/[<>:"/\\|?*\u0000-\u001f]/g, "-")
          .trim()
          .replace(/\s+/g, "-")
          .replace(/[. ]+$/g, "")
          .slice(0, 90) ||
        "website"
      );
    }

    function download(content, filename, type) {
      const blob = new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement("a");

      anchor.href = url;
      anchor.download = filename;
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();

      setTimeout(() => URL.revokeObjectURL(url), 60000);
    }

    function uploadsInProgress() {
      if (!pendingUploads) return false;

      toast("Please wait for the current uploads to finish.");
      return true;
    }

    document.getElementById("saveProject").addEventListener("click", () => {
      if (uploadsInProgress()) return;

      try {
        download(
          JSON.stringify({
            creator: "General Website Creator",
            version: 2,
            state
          }, null, 2),
          filenameBase() + "-project.json",
          "application/json;charset=utf-8"
        );

        dirty = false;

        status.textContent =
          "Project download requested · Check that your backup was saved.";

        toast("Project backup download started.");
      } catch (error) {
        console.error(error);
        toast("Could not create the backup. Try reducing uploaded media size.");
      }
    });

    document.getElementById("exportWebsite").addEventListener("click", () => {
      if (uploadsInProgress()) return;

      try {
        download(
          createDocument(state),
          filenameBase() + ".html",
          "text/html;charset=utf-8"
        );

        toast("Website download started. Save a project backup for later editing.");
      } catch (error) {
        console.error(error);
        toast("Could not export. Try reducing uploaded media size.");
      }
    });

    const projectFile = document.getElementById("projectFile");

    document.getElementById("loadProject").addEventListener("click", () => {
      if (uploadsInProgress()) return;
      projectFile.click();
    });

    projectFile.addEventListener("change", async () => {
      const file = projectFile.files?.[0];
      if (!file) return;

      if (
        dirty &&
        !confirm("Replace your current unsaved changes with this project?")
      ) {
        projectFile.value = "";
        return;
      }

      const revisionAtStart = revision;

      try {
        const text = await file.text();
        const imported = normalizeProject(JSON.parse(text));

        if (
          revision !== revisionAtStart &&
          !confirm(
            "The current project changed while the file was loading. " +
            "Replace it with the imported project?"
          )
        ) {
          return;
        }

        state = imported;
        dirty = false;
        revision++;

        renderEditor();
        updatePreview();

        toast("Project loaded.");
      } catch (error) {
        console.error(error);
        toast(error.message || "Could not load this project.");
      } finally {
        projectFile.value = "";
      }
    });

    // ==========================================================
    // PREVIEW CONTROLS
    // ==========================================================

    const desktopButton = document.getElementById("desktop");
    const mobileButton = document.getElementById("mobile");

    function setPreviewMode(mobile) {
      preview.classList.toggle("mobile", mobile);

      desktopButton.classList.toggle("active", !mobile);
      mobileButton.classList.toggle("active", mobile);

      desktopButton.setAttribute("aria-pressed", String(!mobile));
      mobileButton.setAttribute("aria-pressed", String(mobile));
    }

    desktopButton.addEventListener("click", () => setPreviewMode(false));
    mobileButton.addEventListener("click", () => setPreviewMode(true));

    document.getElementById("refresh").addEventListener(
      "click",
      updatePreview
    );

    // ==========================================================
    // NOTIFICATIONS AND EXIT WARNING
    // ==========================================================

    function toast(message) {
      const element = document.getElementById("toast");

      clearTimeout(toastTimer);
      element.textContent = message;
      element.classList.add("show");

      toastTimer = setTimeout(() => {
        element.classList.remove("show");
      }, 4500);
    }

    window.addEventListener("beforeunload", event => {
      if (!dirty && !pendingUploads) return;

      event.preventDefault();
      event.returnValue = "";
    });

    // ==========================================================
    // START
    // ==========================================================

    renderEditor();
    updatePreview();
  </script>
</body>
</html>
